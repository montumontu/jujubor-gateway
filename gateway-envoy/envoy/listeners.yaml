resources:
- "@type": type.googleapis.com/envoy.config.listener.v3.Listener
  name: listener_0
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 10001
  filter_chains:
    - filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress_http
            codec_type: AUTO
            route_config:
              name: local_route
              virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  routes:
                    - match:
                        prefix: "/health"
                      direct_response:
                        status: 200
                        body:
                          inline_string: "OK"
                    - match:
                        prefix: "/"
                      route:
                        cluster: service_behind_envoy
                        timeout: 10s
                        retry_policy:
                          num_retries: 3
                          retry_on: "connect-failure,refused-stream"
            http_filters:
              - name: envoy.filters.http.router